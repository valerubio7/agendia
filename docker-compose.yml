services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agendia_migrator
      POSTGRES_PASSWORD: agendia
      POSTGRES_DB: agendia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agendia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendia_migrator -d agendia"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  agendia-postgres:
