services:
  postgres:
    # Keep local development on the same verified linux/amd64 PostgreSQL bytes as CI.
    image: postgres@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
    environment:
      POSTGRES_USER: agendia_migrator
      POSTGRES_PASSWORD: agendia
      POSTGRES_DB: agendia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agendia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendia_migrator -d agendia"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  agendia-postgres:
