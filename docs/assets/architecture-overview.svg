<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000" role="img" aria-labelledby="title desc">
  <title id="title">agendIA: una agenda, cuatro procesos</title>
  <desc id="desc">El negocio usa el panel web Next.js, que llama a la API Fastify por HTTP. La API accede a PostgreSQL. El manager intercambia mensajes con clientes por WhatsApp mediante Baileys y coordina mensajería y colas en PostgreSQL. El worker intercambia contexto y resultados de herramientas con DeepSeek por HTTPS y accede a la agenda y al trabajo pendiente mediante repositorios. PostgreSQL incluye pg-boss. El worker no llama a la API y solo el manager envía por WhatsApp. El contorno agrupa agendIA, no máquinas de despliegue.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#355B49" stroke-width="1.7"/>
    </marker>
    <marker id="external-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#AD402A" stroke-width="1.7"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1C2620; }
      .name { font-size: 30px; font-weight: 700; }
      .detail { font-size: 24px; fill: #3D5346; }
      .label { font-size: 24px; fill: #355B49; paint-order: stroke; stroke: #F5F2EB; stroke-width: 9px; stroke-linejoin: round; }
      .external-label { font-size: 22px; fill: #943823; }
    </style>
  </defs>
  <rect width="1100" height="1000" rx="24" fill="#F5F2EB"/>
  <text x="40" y="54" font-size="38" font-weight="700">Una agenda, cuatro procesos</text>
  <text x="40" y="94" class="detail">Dos canales de uso. Un mismo estado confirmado en PostgreSQL.</text>

  <rect x="160" y="250" width="650" height="620" rx="20" fill="none" stroke="#889D8C" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="184" y="281" font-size="21" font-weight="700">agendIA</text>
  <text x="450" y="281" font-size="21">4 procesos + PostgreSQL</text>
  <text x="850" y="280" font-size="20" fill="#943823">Servicios externos</text>

  <!-- Connections precede opaque nodes so no line passes through a component. -->
  <g fill="none" stroke="#355B49" stroke-width="3" marker-end="url(#arrow)">
    <path d="M320 215V298"/>
    <path d="M320 412V508"/>
    <path d="M320 622V748" marker-start="url(#arrow)"/>
    <path d="M508 355H475V748" marker-start="url(#arrow)"/>
    <path d="M630 622V748" marker-start="url(#arrow)"/>
  </g>
  <g fill="none" stroke="#AD402A" stroke-width="3" marker-start="url(#external-arrow)" marker-end="url(#external-arrow)">
    <path d="M752 355H848"/>
    <path d="M752 565H848"/>
  </g>
  <g class="label">
    <text x="344" y="259">Panel</text>
    <text x="344" y="465">HTTP</text>
    <text x="344" y="493">/api</text>
    <text x="206" y="682">Reglas</text>
    <text x="206" y="712">y datos</text>
    <text x="475" y="682" text-anchor="middle">Mensajería</text>
    <text x="475" y="712" text-anchor="middle">y colas</text>
    <text x="654" y="682">Agenda</text>
    <text x="654" y="712">y trabajo</text>
  </g>
  <g class="external-label" text-anchor="middle">
    <text x="800" y="338">Baileys</text>
    <text x="800" y="548">HTTPS</text>
  </g>

  <rect x="200" y="125" width="240" height="90" rx="14" fill="#FFFFFF" stroke="#8A958B" stroke-width="2"/>
  <text x="320" y="162" text-anchor="middle" font-size="28" font-weight="700">Negocio</text>
  <text x="320" y="195" text-anchor="middle" class="detail">Navegador</text>

  <g fill="#E4EDE4" stroke="#355B49" stroke-width="2">
    <rect x="200" y="300" width="240" height="110" rx="14"/>
    <rect x="200" y="510" width="240" height="110" rx="14"/>
    <rect x="510" y="300" width="240" height="110" rx="14"/>
    <rect x="510" y="510" width="240" height="110" rx="14"/>
  </g>
  <g text-anchor="middle">
    <text x="320" y="345" class="name">Web</text>
    <text x="320" y="381" class="detail">Next.js · panel</text>
    <text x="320" y="555" class="name">API</text>
    <text x="320" y="591" class="detail">Fastify · autoriza</text>
    <text x="630" y="345" class="name">Manager</text>
    <text x="630" y="381" class="detail">Recibe y envía</text>
    <text x="630" y="555" class="name">Worker</text>
    <text x="630" y="591" class="detail">Ejecuta el agente</text>
  </g>

  <rect x="200" y="750" width="550" height="95" rx="14" fill="#1C2620"/>
  <rect x="220" y="770" width="6" height="55" rx="3" fill="#FF6B49"/>
  <text x="246" y="789" font-size="30" font-weight="700" fill="#F5F2EB" style="fill:#F5F2EB">PostgreSQL</text>
  <text x="246" y="824" font-size="23" fill="#F5F2EB" style="fill:#F5F2EB">Agenda · mensajes · pendientes · pg-boss</text>

  <g fill="#FFF0E9" stroke="#AD402A" stroke-width="2">
    <rect x="850" y="300" width="210" height="110" rx="14"/>
    <rect x="850" y="510" width="210" height="110" rx="14"/>
  </g>
  <g text-anchor="middle">
    <text x="955" y="345" font-size="28" font-weight="700">WhatsApp</text>
    <text x="955" y="381" class="detail">Cliente</text>
    <text x="955" y="555" font-size="28" font-weight="700">DeepSeek</text>
    <text x="955" y="591" class="detail">Modelo de IA</text>
  </g>

  <g font-size="22">
    <rect x="40" y="908" width="20" height="20" rx="4" fill="#E4EDE4" stroke="#355B49"/>
    <text x="70" y="925">Proceso</text>
    <rect x="220" y="908" width="20" height="20" rx="4" fill="#1C2620"/>
    <text x="250" y="925">Datos durables</text>
    <rect x="455" y="908" width="20" height="20" rx="4" fill="#FFF0E9" stroke="#AD402A"/>
    <text x="485" y="925">Servicio externo</text>
    <path d="M725 918H773" fill="none" stroke="#355B49" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="788" y="925">Intercambio</text>
  </g>
  <text x="40" y="973" font-size="24" font-weight="700">El worker usa repositorios: no pasa por la API.</text>
</svg>
