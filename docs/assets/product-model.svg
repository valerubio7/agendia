<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" aria-labelledby="title desc">
  <title id="title">Las piezas de una agenda, dentro de un negocio</title>
  <desc id="desc">El servicio define qué se ofrece; el recurso, quién o qué atiende; el calendario, cuándo. Estas piezas condicionan la disponibilidad, que no bloquea capacidad. Un turno guardado une cliente, servicio, recurso y horario y conserva las condiciones acordadas.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#46544A" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="680" height="640" rx="20" fill="#F5F2EB"/>
  <rect x="20" y="20" width="640" height="600" rx="16" fill="none" stroke="#CAD1C7" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1C2620">
    <rect x="40" y="40" width="112" height="30" rx="8" fill="#1C2620"/>
    <text x="96" y="61" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1" fill="#F5F2EB">NEGOCIO</text>
    <text x="40" y="111" font-size="29" font-weight="700">La capacidad tiene condiciones</text>
    <g fill="#FFFFFF" stroke="#CAD1C7">
      <rect x="40" y="138" width="188" height="116" rx="12"/>
      <rect x="246" y="138" width="188" height="116" rx="12"/>
      <rect x="452" y="138" width="188" height="116" rx="12"/>
    </g>
    <g text-anchor="middle">
      <g font-size="24" font-weight="700">
        <text x="134" y="177">Servicio</text>
        <text x="340" y="177">Recurso</text>
        <text x="546" y="177">Calendario</text>
      </g>
      <g font-size="19" fill="#46544A">
        <text x="134" y="208">Qué se ofrece</text>
        <text x="134" y="234">Duración y precio</text>
        <text x="340" y="208">Quién o qué atiende</text>
        <text x="340" y="234">Servicios y horario</text>
        <text x="546" y="208">Cuándo se atiende</text>
        <text x="546" y="234">Horario y cierres</text>
      </g>
    </g>
    <g fill="none" stroke="#46544A" stroke-width="2">
      <path d="M134 254V278H546V254"/>
      <path d="M340 254V300" marker-end="url(#arrow)"/>
    </g>
    <rect x="40" y="308" width="600" height="92" rx="12" fill="#E7EDE6"/>
    <text x="340" y="344" text-anchor="middle" font-size="24" font-weight="700">Disponibilidad</text>
    <text x="340" y="376" text-anchor="middle" font-size="19" fill="#46544A">Cruza condiciones y ocupación. No reserva.</text>
    <path d="M340 400V442" fill="none" stroke="#46544A" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <rect x="368" y="409" width="254" height="30" rx="8" fill="#F5F2EB"/>
    <text x="380" y="430" font-size="18" fill="#46544A">Aceptación + validación</text>
    <rect x="40" y="454" width="600" height="140" rx="12" fill="#1C2620"/>
    <rect x="58" y="474" width="6" height="98" rx="3" fill="#FF6B49"/>
    <g fill="#F5F2EB">
      <text x="84" y="502" font-size="27" font-weight="700">Turno guardado</text>
      <text x="84" y="536" font-size="21">Cliente · servicio · recurso · horario</text>
      <text x="84" y="568" font-size="19">Conserva las condiciones acordadas.</text>
    </g>
  </g>
</svg>
