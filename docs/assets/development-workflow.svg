<svg xmlns="http://www.w3.org/2000/svg" width="680" height="668" viewBox="0 0 680 668" role="img" aria-labelledby="title desc">
  <title id="title">Primero el panel; después, el canal</title>
  <desc id="desc">El recorrido local mínimo prepara Bun y el entorno privado, arranca PostgreSQL y aplica migraciones y bootstrap, y levanta API y web. El panel funciona sin proveedores externos. Para mensajería se agregan el manager de WhatsApp y el worker de DeepSeek, con claves y cuentas de prueba. Los E2E crean su propio entorno con proveedores simulados.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#46544A" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="680" height="668" rx="20" fill="#F5F2EB"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1C2620">
    <text x="32" y="43" font-size="16" font-weight="700" letter-spacing="2">DOS RECORRIDOS DE DESARROLLO</text>
    <text x="32" y="87" font-size="30" font-weight="700">Primero el panel. Después, el canal.</text>
    <g fill="#FFFFFF" stroke="#CAD1C7">
      <rect x="32" y="116" width="616" height="80" rx="12"/>
      <rect x="32" y="224" width="616" height="80" rx="12"/>
    </g>
    <g font-size="25" font-weight="700">
      <text x="52" y="149">01 · Preparar el entorno</text>
      <text x="52" y="257">02 · Preparar PostgreSQL</text>
    </g>
    <g font-size="20" fill="#46544A">
      <text x="52" y="179">Bun · dependencias · configuración local privada</text>
      <text x="52" y="287">Docker · migraciones · administrador inicial</text>
    </g>
    <g fill="none" stroke="#46544A" stroke-width="2" marker-end="url(#arrow)">
      <path d="M340 201V217"/>
      <path d="M340 309V325"/>
      <path d="M340 429V460" stroke-dasharray="5 4"/>
    </g>
    <rect x="32" y="332" width="616" height="92" rx="12" fill="#1C2620"/>
    <rect x="50" y="348" width="6" height="58" rx="3" fill="#FF6B49"/>
    <g fill="#F5F2EB">
      <text x="76" y="368" font-size="27" font-weight="700">03 · API + web → panel local</text>
      <text x="76" y="403" font-size="21">Sin WhatsApp ni DeepSeek. Comprobá proxy y acceso.</text>
    </g>
    <rect x="32" y="468" width="616" height="116" rx="12" fill="#E7EDE6"/>
    <text x="52" y="504" font-size="25" font-weight="700">Opcional · mensajería real</text>
    <g font-size="21" fill="#46544A">
      <text x="52" y="538">Manager → WhatsApp · worker → DeepSeek</text>
      <text x="52" y="567">Claves, cuentas de prueba y vinculación desde el panel.</text>
    </g>
    <circle cx="38" cy="622" r="4" fill="#FF6B49"/>
    <text x="52" y="628" font-size="20">E2E prepara su entorno y simula ambos proveedores.</text>
  </g>
</svg>
