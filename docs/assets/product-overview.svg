<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" aria-labelledby="title desc">
  <title id="title">De las reglas del negocio a la reserva</title>
  <desc id="desc">Tres etapas: configurar servicios, recursos y horarios; conversar por WhatsApp y preparar una propuesta; aceptar, validar y guardar el turno. La propuesta no reserva capacidad.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#1C2620" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="680" height="320" rx="20" fill="#F5F2EB"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1C2620">
    <text x="28" y="38" font-size="16" font-weight="700" letter-spacing="2">UN MISMO RECORRIDO, DOS CANALES</text>
    <rect x="28" y="62" width="188" height="200" rx="14" fill="#FFFFFF" stroke="#CAD1C7"/>
    <rect x="246" y="62" width="188" height="200" rx="14" fill="#FFFFFF" stroke="#CAD1C7"/>
    <rect x="464" y="62" width="188" height="200" rx="14" fill="#1C2620"/>
    <g fill="none" stroke="#1C2620" stroke-width="2" marker-end="url(#arrow)">
      <path d="M222 162H238"/>
      <path d="M440 162H456"/>
    </g>
    <rect x="44" y="78" width="38" height="30" rx="8" fill="#E7EDE6"/>
    <rect x="262" y="78" width="38" height="30" rx="8" fill="#E7EDE6"/>
    <rect x="480" y="78" width="38" height="30" rx="8" fill="#FF6B49"/>
    <g font-size="16" font-weight="700" text-anchor="middle">
      <text x="63" y="99">01</text>
      <text x="281" y="99">02</text>
      <text x="499" y="99">03</text>
    </g>
    <g font-size="23" font-weight="700">
      <text x="44" y="145">Configuración</text>
      <text x="262" y="145">Conversación</text>
      <text x="480" y="145" fill="#F5F2EB">Reserva</text>
    </g>
    <g font-size="20" fill="#46544A">
      <text x="44" y="181">Servicios</text>
      <text x="44" y="210">Recursos</text>
      <text x="44" y="239">Horarios</text>
      <text x="262" y="181">WhatsApp</text>
      <text x="262" y="210">Datos reales</text>
      <text x="262" y="239">Propuesta</text>
    </g>
    <g font-size="20" fill="#F5F2EB">
      <text x="480" y="181">Aceptación</text>
      <text x="480" y="210">Validación</text>
      <text x="480" y="239">Turno guardado</text>
    </g>
    <circle cx="36" cy="291" r="4" fill="#FF6B49"/>
    <text x="50" y="297" font-size="18">El panel configura. El chat propone. El backend valida.</text>
  </g>
</svg>
