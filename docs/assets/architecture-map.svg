<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro procesos, una agenda compartida</title>
  <desc id="desc">El panel web llama a la API HTTP, que autoriza y opera en PostgreSQL. El manager recibe y envía WhatsApp y publica trabajo de IA mediante outbox y pg-boss en PostgreSQL. El worker consume trabajo, conversa con DeepSeek y guarda efectos y respuestas. Solo el manager envía por el canal; todos los datos y el trabajo durable se coordinan en PostgreSQL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#46544A" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="680" height="826" rx="20" fill="#F5F2EB"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1C2620">
    <text x="32" y="43" font-size="16" font-weight="700" letter-spacing="2">MAPA DE RESPONSABILIDADES</text>
    <text x="32" y="87" font-size="30" font-weight="700">Una agenda, cuatro procesos</text>
    <g fill="#FFFFFF" stroke="#CAD1C7">
      <rect x="32" y="116" width="280" height="120" rx="12"/>
      <rect x="368" y="116" width="280" height="120" rx="12"/>
      <rect x="32" y="488" width="280" height="150" rx="12"/>
      <rect x="368" y="488" width="280" height="150" rx="12"/>
    </g>
    <g font-size="27" font-weight="700">
      <text x="52" y="156">Panel web</text>
      <text x="388" y="156">API HTTP</text>
      <text x="52" y="530">Manager</text>
      <text x="388" y="530">Worker IA</text>
    </g>
    <g font-size="20" fill="#46544A">
      <text x="52" y="190">Presenta y configura</text>
      <text x="52" y="219">Next.js · /api</text>
      <text x="388" y="190">Autoriza y opera</text>
      <text x="388" y="219">Fastify · contratos</text>
      <text x="52" y="566">Recibe y envía</text>
      <text x="52" y="595">Publica trabajo de IA</text>
      <text x="52" y="624">whatsapp-manager</text>
      <text x="388" y="566">Conversa y valida</text>
      <text x="388" y="595">Guarda respuesta</text>
      <text x="388" y="624">message-worker</text>
    </g>
    <g fill="none" stroke="#46544A" stroke-width="2" marker-end="url(#arrow)">
      <path d="M318 176H360"/>
      <path d="M508 242V294"/>
      <path d="M172 482V438" marker-start="url(#arrow)"/>
      <path d="M508 482V438" marker-start="url(#arrow)"/>
      <path d="M172 644V686" marker-start="url(#arrow)"/>
      <path d="M508 644V686" marker-start="url(#arrow)"/>
    </g>
    <text x="494" y="279" text-anchor="end" font-size="18" fill="#46544A">Lee y escribe</text>
    <rect x="32" y="300" width="616" height="132" rx="12" fill="#1C2620"/>
    <rect x="50" y="320" width="6" height="90" rx="3" fill="#FF6B49"/>
    <g fill="#F5F2EB">
      <text x="76" y="341" font-size="28" font-weight="700">PostgreSQL</text>
      <text x="76" y="376" font-size="21">Datos · auditoría · outbox · órdenes de envío</text>
      <text x="76" y="408" font-size="20">pg-boss coordina el trabajo de IA y resúmenes.</text>
    </g>
    <g fill="#E7EDE6">
      <rect x="32" y="694" width="280" height="60" rx="12"/>
      <rect x="368" y="694" width="280" height="60" rx="12"/>
    </g>
    <g text-anchor="middle" font-size="25" font-weight="700">
      <text x="172" y="732">WhatsApp</text>
      <text x="508" y="732">DeepSeek</text>
    </g>
    <circle cx="38" cy="788" r="4" fill="#FF6B49"/>
    <text x="52" y="794" font-size="19">Solo el manager envía respuestas por WhatsApp.</text>
  </g>
</svg>
