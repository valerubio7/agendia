# Render only with scripts/render-compose.ts; this template does not accept user paths or project names.
name: "{{PROJECT}}"

x-managed-labels: &managed-labels
  com.agendia.environment: "{{ENVIRONMENT}}"
  com.agendia.project: "{{PROJECT}}"
  com.agendia.managed: "true"

x-app-hardening: &app-hardening
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: "{{POSTGRES_IMAGE}}"
    restart: "{{RESTART}}"
    cpus: "{{POSTGRES_CPUS}}"
    mem_limit: "{{POSTGRES_MEMORY}}"
    pids_limit: 256
    stop_grace_period: 120s
    labels: *managed-labels
    volumes:
      - "{{POSTGRES_BIND}}:/var/lib/postgresql/data"
      - "{{CONFIG_DIR}}/postgres.env:/run/agendia/config/postgres.env:ro"
      - "{{SECRETS_DIR}}/postgres-password:/run/secrets/postgres-password:ro"
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  api:
    <<: *app-hardening
    image: "{{API_IMAGE}}"
    command: ["api"]
    restart: "{{RESTART}}"
    cpus: "{{API_CPUS}}"
    mem_limit: "{{API_MEMORY}}"
    stop_grace_period: 30s
    labels: *managed-labels
    env_file:
      - path: "{{CONFIG_DIR}}/api.env"
        required: true
        format: raw
    environment:
      AGENDIA_PROCESS: "api"
      AGENDIA_ENVIRONMENT: "{{ENVIRONMENT}}"
      AGENDIA_RELEASE_DIGEST: "{{RELEASE_DIGEST}}"
    volumes:
      - "{{CONFIG_DIR}}/isolation-manifest.json:/run/agendia/config/isolation-manifest.json:ro"
      - "{{SECRETS_DIR}}/api-database-url:/run/secrets/api-database-url:ro"
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,nosuid,nodev,noexec
      - /run/agendia/api:uid=10001,gid=10001,mode=0750,nosuid,nodev,noexec
    networks: [app, data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3001/internal/live >/dev/null && wget -qO- http://127.0.0.1:3001/internal/ready >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 4

  web:
    <<: *app-hardening
    image: "{{WEB_IMAGE}}"
    command: ["web"]
    restart: "{{RESTART}}"
    cpus: "{{WEB_CPUS}}"
    mem_limit: "{{WEB_MEMORY}}"
    stop_grace_period: 20s
    labels: *managed-labels
    env_file:
      - path: "{{CONFIG_DIR}}/web.env"
        required: true
        format: raw
    environment:
      AGENDIA_PROCESS: "web"
      AGENDIA_ENVIRONMENT: "{{ENVIRONMENT}}"
      AGENDIA_RELEASE_DIGEST: "{{RELEASE_DIGEST}}"
    volumes:
      - "{{CONFIG_DIR}}/isolation-manifest.json:/run/agendia/config/isolation-manifest.json:ro"
      - "{{SECRETS_DIR}}/web-database-url:/run/secrets/web-database-url:ro"
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,nosuid,nodev,noexec
      - /run/agendia/web:uid=10001,gid=10001,mode=0750,nosuid,nodev,noexec
      - /opt/agendia/web/.next/cache:uid=10001,gid=10001,mode=0750,nosuid,nodev,noexec
    networks: [edge, app]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/_health/live >/dev/null && wget -qO- http://127.0.0.1:3000/_health/ready >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 4

  whatsapp-manager:
    <<: *app-hardening
    image: "{{MANAGER_IMAGE}}"
    command: ["whatsapp-manager"]
    restart: "{{RESTART}}"
    cpus: "{{MANAGER_CPUS}}"
    mem_limit: "{{MANAGER_MEMORY}}"
    stop_grace_period: 90s
    labels: *managed-labels
    env_file:
      - path: "{{CONFIG_DIR}}/whatsapp-manager.env"
        required: true
        format: raw
    environment:
      AGENDIA_PROCESS: "whatsapp-manager"
      AGENDIA_ENVIRONMENT: "{{ENVIRONMENT}}"
      AGENDIA_RELEASE_DIGEST: "{{RELEASE_DIGEST}}"
    volumes:
      - "{{CONFIG_DIR}}/isolation-manifest.json:/run/agendia/config/isolation-manifest.json:ro"
      - "{{SECRETS_DIR}}/whatsapp-manager-database-url:/run/secrets/whatsapp-manager-database-url:ro"
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,nosuid,nodev,noexec
      - /run/agendia/whatsapp-manager:uid=10001,gid=10001,mode=0750,nosuid,nodev,noexec
    networks: [edge, data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9090/live >/dev/null && wget -qO- http://127.0.0.1:9090/ready >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 4

  message-worker:
    <<: *app-hardening
    image: "{{WORKER_IMAGE}}"
    command: ["message-worker"]
    restart: "{{RESTART}}"
    cpus: "{{WORKER_CPUS}}"
    mem_limit: "{{WORKER_MEMORY}}"
    stop_grace_period: 90s
    labels: *managed-labels
    env_file:
      - path: "{{CONFIG_DIR}}/message-worker.env"
        required: true
        format: raw
    environment:
      AGENDIA_PROCESS: "message-worker"
      AGENDIA_ENVIRONMENT: "{{ENVIRONMENT}}"
      AGENDIA_RELEASE_DIGEST: "{{RELEASE_DIGEST}}"
    volumes:
      - "{{CONFIG_DIR}}/isolation-manifest.json:/run/agendia/config/isolation-manifest.json:ro"
      - "{{SECRETS_DIR}}/message-worker-database-url:/run/secrets/message-worker-database-url:ro"
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,nosuid,nodev,noexec
      - /run/agendia/message-worker:uid=10001,gid=10001,mode=0750,nosuid,nodev,noexec
    networks: [edge, data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9090/live >/dev/null && wget -qO- http://127.0.0.1:9090/ready >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 4

  provision-roles: &one-shot
    <<: *app-hardening
    image: "{{API_IMAGE}}"
    command: ["provision-roles"]
    profiles: [oneshot]
    restart: "no"
    logging: { driver: "none" }
    env_file:
      - path: "{{CONFIG_DIR}}/provision-roles.env"
        required: true
        format: raw
    environment: { AGENDIA_PROCESS: "provision-roles", AGENDIA_ENVIRONMENT: "{{ENVIRONMENT}}", AGENDIA_RELEASE_DIGEST: "{{RELEASE_DIGEST}}" }
    volumes:
      - "{{CONFIG_DIR}}/isolation-manifest.json:/run/agendia/config/isolation-manifest.json:ro"
      - "{{SECRETS_DIR}}/cluster-admin-database-url:/run/secrets/cluster-admin-database-url:ro"
      - "{{SECRETS_DIR}}/role-cluster-admin-password:/run/secrets/role-cluster-admin-password:ro"
      - "{{SECRETS_DIR}}/role-migrator-password:/run/secrets/role-migrator-password:ro"
      - "{{SECRETS_DIR}}/role-api-password:/run/secrets/role-api-password:ro"
      - "{{SECRETS_DIR}}/role-manager-password:/run/secrets/role-manager-password:ro"
      - "{{SECRETS_DIR}}/role-queue-publisher-password:/run/secrets/role-queue-publisher-password:ro"
      - "{{SECRETS_DIR}}/role-worker-password:/run/secrets/role-worker-password:ro"
      - "{{SECRETS_DIR}}/role-queue-owner-password:/run/secrets/role-queue-owner-password:ro"
      - "{{SECRETS_DIR}}/role-backup-password:/run/secrets/role-backup-password:ro"
    networks: [data]

  migrate:
    <<: *one-shot
    command: ["migrate"]
    env_file:
      - path: "{{CONFIG_DIR}}/migrate.env"
        required: true
        format: raw
    environment: { AGENDIA_PROCESS: "migrate", AGENDIA_ENVIRONMENT: "{{ENVIRONMENT}}", AGENDIA_RELEASE_DIGEST: "{{RELEASE_DIGEST}}", AGENDIA_RELEASE_MANIFEST_FILE: "/run/agendia/config/release-manifest.json", AGENDIA_MIGRATION_EVIDENCE_FILE: "/run/agendia/config/migration-evidence.json" }
    volumes:
      - "{{CONFIG_DIR}}/isolation-manifest.json:/run/agendia/config/isolation-manifest.json:ro"
      - "{{CONFIG_DIR}}/release-manifest.json:/run/agendia/config/release-manifest.json:ro"
      - "{{CONFIG_DIR}}/migration-evidence.json:/run/agendia/config/migration-evidence.json:ro"
      - "{{SECRETS_DIR}}/migrate-database-url:/run/secrets/migrate-database-url:ro"

  queue-init:
    <<: *one-shot
    command: ["queue-init"]
    env_file:
      - path: "{{CONFIG_DIR}}/queue-init.env"
        required: true
        format: raw
    environment: { AGENDIA_PROCESS: "queue-init", AGENDIA_ENVIRONMENT: "{{ENVIRONMENT}}", AGENDIA_RELEASE_DIGEST: "{{RELEASE_DIGEST}}" }
    volumes:
      - "{{CONFIG_DIR}}/isolation-manifest.json:/run/agendia/config/isolation-manifest.json:ro"
      - "{{SECRETS_DIR}}/queue-init-database-url:/run/secrets/queue-init-database-url:ro"

  bootstrap-admin:
    <<: *one-shot
    user: "0:0"
    command: ["bootstrap-admin"]
    env_file:
      - path: "{{CONFIG_DIR}}/bootstrap-admin.env"
        required: true
        format: raw
    environment: { AGENDIA_PROCESS: "bootstrap-admin", AGENDIA_ENVIRONMENT: "{{ENVIRONMENT}}", AGENDIA_RELEASE_DIGEST: "{{RELEASE_DIGEST}}", AGENDIA_ADMIN_PASSWORD_FILE: "/run/agendia/{{ENVIRONMENT}}/bootstrap/admin-password" }
    volumes:
      - "{{CONFIG_DIR}}/isolation-manifest.json:/run/agendia/config/isolation-manifest.json:ro"
      - "{{SECRETS_DIR}}/bootstrap-admin-database-url:/run/secrets/bootstrap-admin-database-url:ro"
      - "/run/agendia/{{ENVIRONMENT}}/bootstrap/admin-password:/run/agendia/{{ENVIRONMENT}}/bootstrap/admin-password:ro"
    networks: [data]

  cloudflared:
    image: "{{CLOUDFLARED_IMAGE}}"
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "--logformat",
        "json",
        "--config",
        "/run/agendia/config/cloudflared.yml",
        "run",
      ]
    restart: "{{RESTART}}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 64
    cpus: "{{CLOUDFLARED_CPUS}}"
    mem_limit: "{{CLOUDFLARED_MEMORY}}"
    stop_grace_period: 20s
    labels: *managed-labels
    env_file:
      - path: "{{CONFIG_DIR}}/cloudflared.env"
        required: true
        format: raw
    environment:
      AGENDIA_PROCESS: "cloudflared"
      AGENDIA_ENVIRONMENT: "{{ENVIRONMENT}}"
      AGENDIA_RELEASE_DIGEST: "{{RELEASE_DIGEST}}"
    volumes:
      - "{{CONFIG_DIR}}/cloudflared.yml:/run/agendia/config/cloudflared.yml:ro"
      - "{{SECRETS_DIR}}/cloudflared-{{ENVIRONMENT}}.json:/run/secrets/cloudflared-{{ENVIRONMENT}}.json:ro"
    networks: [edge]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

networks:
  edge:
    name: "{{PROJECT}}-edge"
    labels: *managed-labels
  app:
    name: "{{PROJECT}}-app"
    internal: true
    labels: *managed-labels
  data:
    name: "{{PROJECT}}-data"
    internal: true
    labels: *managed-labels
