name: Deploy production
on:
  workflow_call:
    inputs:
      release:
        required: true
        type: string
      publisher_run:
        required: true
        type: string
      skip_backup:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release:
        description: Full 40-character published main commit SHA
        required: false
        type: string
      skip_backup:
        description: Waive backup for this manual 0.7.1 deployment only
        required: false
        type: boolean
        default: false
      connection_only:
        description: Verify the protected private connection without deploying
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  preflight:
    outputs:
      backup_flag: ${{ steps.provenance.outputs.backup_flag }}
    permissions:
      contents: read
      actions: read
      packages: read
    if: github.ref == 'refs/heads/main' && !inputs.connection_only
    runs-on: ubuntu-latest
    steps:
      - name: Verify human protection and release provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE: ${{ inputs.release }}
          PUBLISHER_RUN: ${{ inputs.publisher_run }}
          SKIP_BACKUP: ${{ inputs.skip_backup }}
          EVENT_NAME: ${{ github.event_name }}
          CONNECTION_ONLY: ${{ inputs.connection_only }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SKIP_BACKUP" == false || "$SKIP_BACKUP" == true ]]
          if [[ "$SKIP_BACKUP" == true ]]; then
            [[ "$EVENT_NAME" == workflow_dispatch && "$CONNECTION_ONLY" == false ]]
          fi
          # No environment or SSH secrets: missing/unreadable protection fails closed.
          gh api "repos/$REPOSITORY/environments/production" | jq -e '
            .protection_rules | any(.type == "required_reviewers" and
              (.reviewers | any(.type == "User" and .reviewer.type == "User" and
                (.reviewer.id | type == "number" and . > 0) and
                (.reviewer.login | type == "string" and length > 0 and (endswith("[bot]") | not)))))'
          relation=$(gh api "repos/$REPOSITORY/compare/$RELEASE...main" --jq .status)
          [[ "$relation" == identical || "$relation" == ahead ]]
          gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE&per_page=100" | jq -e --arg repo "$REPOSITORY" --arg sha "$RELEASE" '
            .workflow_runs | map(select(.name == "CI" and .path == ".github/workflows/ci.yml" and
              .head_sha == $sha and .head_branch == "main" and .event == "push" and .head_repository.full_name == $repo)) |
            first | .status == "completed" and .conclusion == "success"'
          if [[ -n "$PUBLISHER_RUN" ]]; then
            [[ "$PUBLISHER_RUN" =~ ^[0-9]+$ ]]
            gh api "repos/$REPOSITORY/actions/runs/$PUBLISHER_RUN" > publisher.json
          else
            gh api "repos/$REPOSITORY/actions/workflows/publish.yml/runs?per_page=100" | jq --arg sha "$RELEASE" \
              '.workflow_runs | map(select(.display_title == ("Publish " + $sha))) | first' > publisher.json
          fi
          jq -e --arg repo "$REPOSITORY" --arg sha "$RELEASE" --arg run "$PUBLISHER_RUN" '
            .name == "Publish release" and .path == ".github/workflows/publish.yml" and
            .status == "completed" and .conclusion == "success" and .head_repository.full_name == $repo and
            .display_title == ("Publish " + $sha) and
            (if $run != "" then (.id | tostring) == $run and .event == "push" and .head_sha == $sha
             else (.event == "push" and .head_sha == $sha) or (.event == "workflow_run" and .head_branch == "main") end)' publisher.json
          # Legacy manual proof does not qualify for unattended automatic deployment.
          if [[ $(jq -r .event publisher.json) == push || "$SKIP_BACKUP" == true ]]; then
            version=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPOSITORY/contents/package.json?ref=$RELEASE" | jq -er .version)
            [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            if [[ "$SKIP_BACKUP" == true ]]; then [[ "$version" == 0.7.1 ]]; fi
            tag="v$version"
            gh api "repos/$REPOSITORY/releases/tags/$tag" | jq -e --arg tag "$tag" --arg sha "$RELEASE" '
              .tag_name == $tag and .target_commitish == $sha and .draft == false and .prerelease == false and
              (.published_at | type == "string" and length > 0)'
            gh api "repos/$REPOSITORY/git/ref/tags/$tag" > tag.json
            if [[ $(jq -r .object.type tag.json) == tag ]]; then
              object=$(jq -er .object.sha tag.json); [[ "$object" =~ ^[0-9a-f]{40}$ ]]
              gh api "repos/$REPOSITORY/git/tags/$object" > tag.json
            fi
            jq -e --arg sha "$RELEASE" '.object.type == "commit" and .object.sha == $sha' tag.json
            image="ghcr.io/${REPOSITORY,,}"
            digest=$(docker buildx imagetools inspect "$image:$RELEASE" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ $(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}') == "$digest" ]]
            docker pull "$image@$digest"
            [[ $(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image@$digest") == "$RELEASE" ]]
          fi
          if [[ "$SKIP_BACKUP" == true ]]; then
            printf 'backup_flag=--skip-backup-for-release=%s\n' "$RELEASE" >> "$GITHUB_OUTPUT"
          fi
  connection_preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.connection_only == true && github.repository == 'valerubio7/agendia' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/tailscale-private-deploy' || github.ref == 'refs/heads/ci/tailscale-cli-integration')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Verify human production protection
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SKIP_BACKUP: ${{ inputs.skip_backup }}
        run: |
          set -euo pipefail
          [[ "$SKIP_BACKUP" == false ]]
          gh api "repos/$REPOSITORY/environments/production" | jq -e '
            .protection_rules | any(.type == "required_reviewers" and
              (.reviewers | any(.type == "User" and .reviewer.type == "User" and
                (.reviewer.id | type == "number" and . > 0) and
                (.reviewer.login | type == "string" and length > 0 and (endswith("[bot]") | not)))))'
  connection_check:
    needs: connection_preflight
    if: github.event_name == 'workflow_dispatch' && inputs.connection_only == true && github.repository == 'valerubio7/agendia' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/tailscale-private-deploy' || github.ref == 'refs/heads/ci/tailscale-cli-integration')
    environment: production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Mask pinned connection host
        env:
          KNOWN_HOSTS: ${{ secrets['PRODUCTION_KNOWN_HOSTS'] }}
        run: |
          set -euo pipefail
          host= key_type= key= extra=
          while read -r host key_type key extra; do
            [[ -z "$host" || "$host" == \#* ]] || break
          done <<< "$KNOWN_HOSTS"
          # Only a plain single-host Ed25519 pin is accepted; unknown formats fail closed.
          [[ "$host" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$key_type" == ssh-ed25519 ]]
          [[ "$key" =~ ^[A-Za-z0-9+/]+={0,2}$ && -z "$extra" ]]
          printf '::add-mask::%s\n' "$host"
      - name: Download version-matched connection action after approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          action_dir=.github/actions/tailscale-connection
          mkdir -p "$action_dir"
          for file in action.yml main.mjs post.mjs; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPOSITORY/contents/$action_dir/$file?ref=$SOURCE_SHA" > "$action_dir/$file"
          done
      - name: Validate private connection credentials
        env:
          TS_CLIENT_ID: ${{ vars.PRODUCTION_TAILSCALE_CLIENT_ID }}
          TS_AUDIENCE: ${{ vars.PRODUCTION_TAILSCALE_AUDIENCE }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          SSH_KEY: ${{ secrets['PRODUCTION_SSH_KEY'] }}
          KNOWN_HOSTS: ${{ secrets['PRODUCTION_KNOWN_HOSTS'] }}
        run: |
          set -euo pipefail
          [[ -n "$TS_CLIENT_ID" && -n "$TS_AUDIENCE" ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ && "$SSH_PORT" -ge 1 && "$SSH_PORT" -le 65535 ]]
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]]
      - name: Connect private deployment network
        uses: ./.github/actions/tailscale-connection
        with:
          client-id: ${{ vars.PRODUCTION_TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.PRODUCTION_TAILSCALE_AUDIENCE }}
      - name: Verify read-only SSH identity
        env:
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          SSH_KEY: ${{ secrets['PRODUCTION_SSH_KEY'] }}
          KNOWN_HOSTS: ${{ secrets['PRODUCTION_KNOWN_HOSTS'] }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ && "$SSH_PORT" -ge 1 && "$SSH_PORT" -le 65535 ]]
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]]
          umask 077
          work=$(mktemp -d "${TMPDIR:-/tmp}/agendia-connection.XXXXXXXX")
          cleanup() { rm -rf -- "$work"; }
          trap cleanup EXIT
          printf '%s\n' "$SSH_KEY" > "$work/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$work/known_hosts"
          chmod 600 "$work/key" "$work/known_hosts"
          if identity=$(ssh -F /dev/null -i "$work/key" -o IdentityAgent=none -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o GSSAPIAuthentication=no \
            -o ConnectTimeout=10 -o ConnectionAttempts=1 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "id -un" 2> "$work/error"); then
            [[ "$identity" == "$SSH_USER" ]]
          else
            status=$?
            echo "SSH connection failed." >&2
            exit "$status"
          fi
          echo "Connection verified."
  deploy:
    needs: preflight
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Mask pinned connection host
        env:
          KNOWN_HOSTS: ${{ secrets['PRODUCTION_KNOWN_HOSTS'] }}
        run: |
          set -euo pipefail
          host= key_type= key= extra=
          while read -r host key_type key extra; do
            [[ -z "$host" || "$host" == \#* ]] || break
          done <<< "$KNOWN_HOSTS"
          # Only a plain single-host Ed25519 pin is accepted; unknown formats fail closed.
          [[ "$host" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$key_type" == ssh-ed25519 ]]
          [[ "$key" =~ ^[A-Za-z0-9+/]+={0,2}$ && -z "$extra" ]]
          printf '::add-mask::%s\n' "$host"
      - name: Download version-matched deployment files after approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]]
          for file in deploy/deploy-release.sh compose.production.yml; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPOSITORY/contents/$file?ref=$RELEASE" > "${file##*/}"
          done
          action_dir=.github/actions/tailscale-connection
          mkdir -p "$action_dir"
          for file in action.yml main.mjs post.mjs; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPOSITORY/contents/$action_dir/$file?ref=$RELEASE" > "$action_dir/$file"
          done
      - name: Validate private connection identifiers
        env:
          TS_CLIENT_ID: ${{ vars.PRODUCTION_TAILSCALE_CLIENT_ID }}
          TS_AUDIENCE: ${{ vars.PRODUCTION_TAILSCALE_AUDIENCE }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
        run: |
          set -euo pipefail
          [[ -n "$TS_CLIENT_ID" && -n "$TS_AUDIENCE" ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
      # Before live use, human Tailnet trust must bind the OIDC subject
      # repo:valerubio7@129685751/agendia@1346725840:environment:production with auth_keys write and
      # only tag:agendia-ci / least-privilege target access. No static secret.
      # Repository action requests an ephemeral node and attempts owned cleanup in post.
      - name: Connect private deployment network
        uses: ./.github/actions/tailscale-connection
        with:
          client-id: ${{ vars.PRODUCTION_TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.PRODUCTION_TAILSCALE_AUDIENCE }}
      - name: Transfer and execute over pinned SSH
        env:
          RELEASE: ${{ inputs.release }}
          BACKUP_FLAG: ${{ needs.preflight.outputs.backup_flag }}
          REPOSITORY: ${{ github.repository }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          APP_DIR: ${{ vars.PRODUCTION_APP_DIR }}
          PROJECT: ${{ vars.PRODUCTION_COMPOSE_PROJECT }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ && "$SSH_PORT" -ge 1 && "$SSH_PORT" -le 65535 ]]
          [[ "$APP_DIR" =~ ^/[a-zA-Z0-9_/-]+$ ]]
          [[ "$PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]]
          waiver_arg=
          if [[ -n "$BACKUP_FLAG" ]]; then
            [[ "$BACKUP_FLAG" == "--skip-backup-for-release=$RELEASE" ]]
            waiver_arg=" '$BACKUP_FLAG'"
          fi
          namespace="${REPOSITORY,,}"
          [[ "$namespace" =~ ^[a-z0-9_.-]+/[a-z0-9_.-]+$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          options=(-i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts")
          # Unique incoming directory; selected script takes the host-wide deployment lock.
          incoming="$APP_DIR/.incoming-$RELEASE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "umask 077; mkdir '$incoming'"
          scp "${options[@]}" -P "$SSH_PORT" deploy-release.sh compose.production.yml "$SSH_USER@$SSH_HOST:$incoming/"
          ssh "${options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash '$incoming/deploy-release.sh' '$RELEASE' '$namespace' '$APP_DIR' '$PROJECT'$waiver_arg"
