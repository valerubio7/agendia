name: Queue approved production deployment
on:
  workflow_run:
    workflows: [Publish release]
    types: [completed]
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/deploy.yml
    with:
      # workflow_run's own github.sha is main, not the published source.
      release: ${{ github.event.workflow_run.head_sha }}
      publisher_run: ${{ format('{0}', github.event.workflow_run.id) }}
